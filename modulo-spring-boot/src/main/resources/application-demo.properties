# Perfil "demo": base de datos H2 en memoria con la misma estructura y datos
# de tienda_abarrotes. Se activa con --spring.profiles.active=demo
spring.datasource.url=jdbc:h2:mem:tienda_abarrotes;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo/esquema.sql
spring.sql.init.data-locations=classpath:demo/datos.sql
spring.sql.init.encoding=UTF-8
# Consola web de H2 para revisar las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
