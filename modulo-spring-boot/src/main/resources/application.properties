# Módulo de proveedores y compras - Tienda de Abarrotes
server.port=8080
spring.application.name=tienda-abarrotes-spring

# Base de datos tienda_abarrotes (por defecto root sin contraseña)
# Se pueden cambiar con variables de entorno DB_URL, DB_USUARIO y DB_CLAVE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_abarrotes?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}

# La estructura la crea el script SQL; Hibernate no modifica las tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.mvc.format.date=yyyy-MM-dd
# La sesión solo por cookie (evita ;jsessionid en las direcciones)
server.servlet.session.tracking-modes=cookie

# Usuario que queda registrado como responsable de las compras
tienda.usuario-compras=mvargas
