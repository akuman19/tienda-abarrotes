# Mensajes cuando el texto enviado no se puede convertir al tipo del campo
typeMismatch.java.lang.Integer=Debe ser un número entero.
typeMismatch.java.math.BigDecimal=Debe ser un valor numérico (use punto para los decimales).
typeMismatch.java.time.LocalDate=La fecha no es válida (formato aaaa-mm-dd).
typeMismatch=El valor no tiene el formato esperado.
